name: test2
on:
  workflow_dispatch:
    inputs:
      url:
        description: "test url"
        required: true
        default: "https://example.com/test.m3u8?tag=29"
      audio_url:
        description: "audio url"
        required: false
        default: ''
jobs:
  smart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: echo ok
      - name: Download + merge (stream copy, no encode)
        run: echo ok
      - name: Check size and decide
        id: decide
        run: echo ok
      - name: Light h265 (only if >2GB)
        if: steps.decide.outputs.mode == 'encode'
        run: |
          ffmpeg -y -loglevel warning -i output.mp4 \
            -c:v libx265 -crf 28 -preset ultrafast -tag:v hvc1 \
            -c:a aac -b:a 128k \
            output_h265.mp4
          mv output_h265.mp4 output.mp4
          ls -lh output.mp4
          echo "After encode: $(( $(stat -c%s output.mp4) / 1024 / 1024 )) MB"
      - name: Extract audio (if exists)
        run: echo ok
      - name: Package zip
        run: echo ok
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo ok

name: test2
on:
  workflow_dispatch:
    inputs:
      url:
        description: "test url"
        required: true
        default: "https://example.com/test.m3u8?tag=29"
      audio_url:
        description: "audio url"
        required: false
        default: ''
jobs:
  smart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: echo ok
      - name: Download + merge (stream copy, no encode)
        run: |
          yt-dlp \
            --concurrent-fragments 16 \
            --retries 10 \
            -f "bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            -o "output.%(ext)s" \
            "${{ inputs.url }}"
          ls -lh output.*
      - name: Check size and decide
        id: decide
        run: |
          SIZE=$(stat -c%s output.mp4)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "File size: $SIZE bytes ($(( SIZE / 1024 / 1024 )) MB)"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "mode=encode" >> "$GITHUB_OUTPUT"
            echo "File > 2GB - light h265 compression lagega"
          else
            echo "mode=copy" >> "$GITHUB_OUTPUT"
            echo "File < 2GB - stream copy (no encode), fast"
          fi
      - name: Light h265 (only if >2GB)
        if: steps.decide.outputs.mode == 'encode'
        run: echo ok
      - name: Extract audio (if exists)
        run: echo ok
      - name: Package zip
        run: echo ok
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo ok

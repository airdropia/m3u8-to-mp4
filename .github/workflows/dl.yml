name: test2
on:
  workflow_dispatch:
    inputs:
      url:
        description: "test url"
        required: true
        default: "https://example.com/test.m3u8?tag=29"
      audio_url:
        description: "audio url"
        required: false
        default: ''
jobs:
  smart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: echo ok
      - name: Download
        run: echo ok
      - name: Check size and decide
        id: decide
        run: echo ok
      - name: Light h265 (only if >2GB)
        if: steps.decide.outputs.mode == 'encode'
        run: echo ok
      - name: Extract audio (if exists)
        run: echo ok
      - name: Package zip
        run: echo ok
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="merged-$(date +%s)"
          AUDIO_ASSET=""
          [ -f audio.m4a ] && AUDIO_ASSET="audio.m4a"
          if [ -n "$AUDIO_ASSET" ]; then
            gh release create "$TAG" video.zip "$AUDIO_ASSET" --title "Merged $TAG" --notes "Source: ${{ inputs.url }} - mode: ${{ steps.decide.outputs.mode }}"
          else
            gh release create "$TAG" video.zip --title "Merged $TAG" --notes "Source: ${{ inputs.url }} - mode: ${{ steps.decide.outputs.mode }}"
          fi
          echo "DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/$TAG/video.zip" >> "$GITHUB_STEP_SUMMARY"
          [ -f audio.m4a ] && echo "AUDIO: https://github.com/${{ github.repository }}/releases/download/$TAG/audio.m4a" >> "$GITHUB_STEP_SUMMARY"

name: test2
on:
  workflow_dispatch:
    inputs:
      url:
        description: "test url"
        required: true
        default: "https://example.com/test.m3u8?tag=29"
      audio_url:
        description: "audio url"
        required: false
        default: ''
jobs:
  smart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: echo ok
      - name: Download
        run: echo ok
      - name: Check size and decide
        id: decide
        run: echo ok
      - name: Light h265 (only if >2GB)
        if: steps.decide.outputs.mode == 'encode'
        run: echo ok
      - name: Extract audio (if exists)
        run: |
          has_audio=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output.mp4 | head -1)
          if [ -n "$has_audio" ]; then
            ffmpeg -y -loglevel error -i output.mp4 -vn -c:a copy audio.m4a
            echo "audio: $has_audio -> audio.m4a"
            ls -lh audio.m4a
          else
            echo "NO AUDIO - skip"
          fi

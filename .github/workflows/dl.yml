name: test2
on:
  workflow_dispatch:
    inputs:
      url:
        description: "test url"
        required: true
        default: "https://example.com/test.m3u8?tag=29"
      audio_url:
        description: "audio url"
        required: false
        default: ''
jobs:
  smart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: echo ok
      - name: Download
        run: |
          yt-dlp \
            --concurrent-fragments 16 \
            --retries 10 \
            -f "bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            -o "output.%(ext)s" \
            "${{ inputs.url }}"
          ls -lh output.*

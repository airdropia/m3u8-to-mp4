name: test2
on:
  workflow_dispatch:
    inputs:
      url:
        description: "test url"
        required: true
        default: "https://example.com/test.m3u8?tag=29"
      audio_url:
        description: "audio url"
        required: false
        default: ''
jobs:
  smart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: echo ok
      - name: Download
        run: echo ok
      - name: Check size and decide
        id: decide
        run: echo ok
      - name: Light h265 (only if >2GB)
        if: steps.decide.outputs.mode == 'encode'
        run: |
          ffmpeg -y -loglevel warning -i output.mp4 \
            -c:v libx265 -crf 28 -preset ultrafast -tag:v hvc1 \
            -c:a aac -b:a 128k \
            output_h265.mp4

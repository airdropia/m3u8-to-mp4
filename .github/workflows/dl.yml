name: test2
on:
  workflow_dispatch:
    inputs:
      url:
        description: "test url"
        required: true
        default: "https://example.com/test.m3u8?tag=29"
      audio_url:
        description: "audio url"
        required: false
        default: ''
jobs:
  smart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: echo ok
      - name: Download
        run: echo ok
      - name: Check size and decide
        id: decide
        run: |
          SIZE=$(stat -c%s output.mp4)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "File size: $SIZE bytes"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "mode=encode" >> "$GITHUB_OUTPUT"
          else
            echo "mode=copy" >> "$GITHUB_OUTPUT"
          fi

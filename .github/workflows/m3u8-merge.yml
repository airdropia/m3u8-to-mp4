name: m3u8 to mp4 (merge only, no encode)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'm3u8 / HLS / tweet URL (master playlist with audio)'
        required: true
        default: 'https://video.twimg.com/amplify_video/2114470150699130880/pl/E8b928cjQN2ypYEx.m3u8?tag=29'
      audio_url:
        description: 'Audio m3u8 URL (optional - video-only source ke liye)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Download + merge (no encode, stream copy)
        run: |
          yt-dlp \
            --concurrent-fragments 16 \
            --retries 10 \
            -f "bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            -o "output.%(ext)s" \
            "${{ inputs.url }}"
          ls -lh output.*

      - name: Extract audio (if exists)
        run: |
          has_audio=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output.mp4 | head -1)
          if [ -n "$has_audio" ]; then
            ffmpeg -y -loglevel error -i output.mp4 -vn -c:a copy audio.m4a
            echo "audio: $has_audio -> audio.m4a"
            ls -lh audio.m4a
          else
            echo "NO AUDIO - skip"
          fi

      - name: Package zip
        run: |
          python3 -m zipfile -c video.zip output.mp4
          ls -lh video.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="merged-$(date +%s)"
          AUDIO_ASSET=""
          [ -f audio.m4a ] && AUDIO_ASSET="audio.m4a"
          if [ -n "$AUDIO_ASSET" ]; then
            gh release create "$TAG" video.zip "$AUDIO_ASSET" --title "Merged (no encode) $TAG" --notes "Source: ${{ inputs.url }} - stream copy, no re-encode"
          else
            gh release create "$TAG" video.zip --title "Merged (no encode) $TAG" --notes "Source: ${{ inputs.url }} - stream copy, no re-encode"
          fi
          echo "DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/$TAG/video.zip" >> "$GITHUB_STEP_SUMMARY"
          [ -f audio.m4a ] && echo "AUDIO: https://github.com/${{ github.repository }}/releases/download/$TAG/audio.m4a" >> "$GITHUB_STEP_SUMMARY"
name: m3u8 to mp4

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'm3u8 / HLS link'
        required: true
        default: 'https://video.twimg.com/amplify_video/2107018999351410688/pl/avc1/1920x1080/ckTVsct0MPiAKUNM.m3u8'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version
          ffmpeg -version | head -1

      - name: Download and convert
        run: |
          yt-dlp \
            --concurrent-fragments 16 \
            --retries 10 \
            --continue \
            --merge-output-format mp4 \
            -o "video.%(ext)s" \
            "${{ github.event.inputs.url }}"
          # normalize to a single fixed mp4 name (copy = no re-encode)
          src=$(find . -maxdepth 1 -name 'video.*' -type f | head -1)
          ext="${src##*.}"
          mv "$src" "raw.$ext"
          ffmpeg -y -loglevel error -i "raw.$ext" -c copy output.mp4
          ls -lh output.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 output.mp4 | awk '{print "duration_s:", $1}'

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output.mp4
          if-no-files-found: error

      - name: Create release with direct download link
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(stat -c%s output.mp4)
          if [ "$SIZE" -le 1610612736 ]; then
            TAG="converted-$(date +%s)"
            gh release create "$TAG" output.mp4 --title "Converted $TAG" --notes "Source: ${{ github.event.inputs.url }}"
            echo "DIRECT LINK (permanent): https://github.com/${{ github.repository }}/releases/download/$TAG/output.mp4" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "video >1.5GiB -> release asset limit (2GiB) ke bahar, artifact use karo" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Print artifact download link
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" -q '.artifacts[0].id')
          echo "ARTIFACT LINK (zip, hai 90 din): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/$AID" >> "$GITHUB_STEP_SUMMARY"
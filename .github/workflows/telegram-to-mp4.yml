name: telegram to mp4 (h265, no local machine)

# Poora kaam GitHub runner pe: tdl se authenticated Telegram media download,
# source ko release-asset bana ke convert-fast (parallel h265 + zip) ko call.
# Local machine pe kuch bhi download/encode nahi hota.
#
# Login: default QR. Run start hone ke baad QR live log me aata hai - Telegram app
# (Settings > Devices > Link Desktop Device) se scan karo, job khud aage badh jata hai.
# Mode=code tabhi chahiye jab QR na ho (ya 2FA ho): repo secrets TG_PHONE + TG_LOGIN_CODE.

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Telegram link (t.me/channel/post, ya channel/123-140 range)'
        required: true
        default: 'https://t.me/MehmatFatihUrdu/576'
      login:
        description: 'qr = live log me QR scan karo (recommended) | code = phone+5-digit code'
        required: false
        default: 'qr'
      chunks:
        description: 'Parallel encode chunks (jitne chunks, utne jobs)'
        required: false
        default: '8'
      crf:
        description: 'h265 CRF (chhota number = better quality/bigger)'
        required: false
        default: '28'
      preset:
        description: 'x265 preset (ultrafast fastest, veryfast/medium slower+smaller)'
        required: false
        default: 'ultrafast'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      url: ${{ steps.rel.outputs.url }}
    steps:
      - name: Install tdl
        run: |
          curl -sL https://github.com/iyear/tdl/releases/latest/download/tdl_Linux_64bit.tar.gz | tar xz -C /usr/local/bin
          tdl version

      - name: Login (QR scan, ya phone + code)
        env:
          MODE: ${{ inputs.login }}
          PHONE: ${{ secrets.TG_PHONE }}
          CODE: ${{ secrets.TG_LOGIN_CODE }}
        run: |
          if [ "$MODE" = "code" ]; then
            if [ -z "$PHONE" ] || [ -z "$CODE" ]; then
              echo "::error::code mode me repo secrets TG_PHONE + TG_LOGIN_CODE chahiye"
              exit 1
            fi
            # tdl ka survey prompt TTY maangta hai; script se pseudo-TTY milta hai
            printf '%s\n%s\n' "$PHONE" "$CODE" | script -qec "tdl login -T code" /dev/null
          else
            echo "QR log me aayega - Telegram app: Settings > Devices > Link Desktop Device se scan karo (~60s me expire hota hai)"
            echo "Job ruka rahega jab tak scan na ho - Actions page ka live log dekhte rehna."
            timeout --signal=INT 300 tdl login -T qr
          fi
          tdl chat ls
          echo "login ok"

      - name: Download media
        run: |
          mkdir -p out
          tdl dl -u "${{ inputs.link }}" -d out
          ls -lh out
          find out -type f -size +1M -printf '%s %p\n' | sort -rn | head -5

      - name: Publish source + call h265 pipeline
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(find out -type f -size +1M | head -1)
          if [ -z "$f" ]; then
            echo "::error::is link pe koi media nahi mila - post shayad text-only/link-preview hai"
            exit 1
          fi
          asset="source$(echo "$f" | grep -oE '\.[a-z0-9]{2,4}$')"
          TAG="tg-src-$(date +%s)"
          gh release create "$TAG" "$f#$asset" --title "Telegram source $TAG" \
            --notes "Raw download for ${{ inputs.link }} (no re-encode)."
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$asset"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "SOURCE (unedited): $URL" >> "$GITHUB_STEP_SUMMARY"

  convert:
    needs: fetch
    uses: ./.github/workflows/convert-fast.yml
    with:
      url: ${{ needs.fetch.outputs.url }}
      chunks: ${{ inputs.chunks }}
      crf: ${{ inputs.crf }}
      preset: ${{ inputs.preset }}
name: telegram to mp4 (h265, no local machine)

# Poora kaam GitHub runner pe: tdl se authenticated Telegram media download,
# source ko release-asset bana ke convert-fast (parallel h265 + zip) ko call.
# Local machine pe kuch bhi download/encode nahi hota.
#
# Login: pehli baar QR scan (Telegram app/64gram: Settings > Devices > Link Desktop Device),
# uske baad tdl ka session Actions cache me chala jata hai - aage har run me login hi nahi
# chahiye. Session expire/invalid ho jaye to step khud QR mode me gir jata hai.

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Telegram link (t.me/channel/post, ya channel/123-140 range)'
        required: true
        default: 'https://t.me/MehmatFatihUrdu/576'
      login:
        description: 'auto = cache se session (recommended) | qr = hamesha QR scan'
        required: false
        default: 'auto'
      chunks:
        description: 'Parallel encode chunks (jitne chunks, utne jobs)'
        required: false
        default: '8'
      crf:
        description: 'h265 CRF (chhota number = better quality/bigger)'
        required: false
        default: '28'
      preset:
        description: 'x265 preset (ultrafast fastest, veryfast/medium slower+smaller)'
        required: false
        default: 'ultrafast'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      url: ${{ steps.rel.outputs.url }}
    steps:
      # gh release ko git repo chahiye - bina checkout ke 'failed to run git' error aata hai
      - uses: actions/checkout@v4

      - name: Install tdl
        run: |
          curl -sL https://github.com/iyear/tdl/releases/latest/download/tdl_Linux_64bit.tar.gz | tar xz -C /usr/local/bin
          tdl version

      - name: Restore tdl session (cache)
        uses: actions/cache/restore@v4
        with:
          path: ~/.tdl
          key: tdl-session-v1

      - name: Login (QR scan)
        id: login
        env:
          MODE: ${{ inputs.login }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODE" != "qr" ] && tdl chat ls >/dev/null 2>&1; then
            echo "cached session se login ok - kuch karne ki zarurat nahi"
            echo "did_login=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get install -y -qq python3-pil >/dev/null

          # tdl ASCII QR (half-block chars) ko real PNG me convert karte hain,
          # kyunki Actions live log half-block QR ko theek nahi dikhata - phone scanner fail hota hai.
          cat > render.py <<'PY'
          import re, sys
          from PIL import Image
          raw = open(sys.argv[1], encoding='utf-8', errors='ignore').read()
          # cursor-up/down sequences ke baad QR rows bina newline ke chipakte hain -
          # unhe newline me badlo taaki har QR row apni line ho
          raw = re.sub(r'\x1b\[[0-9;]*[ABCD]', '\n', raw)
          src = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', raw)
          HALF = set('█▀▄▔▁ ')
          runs, cur = [], []
          for ln in src.replace('\r', '\n').split('\n'):
              ln = ''.join(c for c in ln if c in HALF)
              if len(ln) >= 20:
                  cur.append(ln)
              elif cur:
                  runs.append(cur); cur = []
          if cur:
              runs.append(cur)
          if not runs:
              sys.exit(1)
          # tdl har ~30s QR redraw karta hai - ek hi run me sab frames chipke aate hain.
          # Frame height (char rows) ~= width (square QR), to last complete frame lo.
          cands = [r for r in runs if len(r) >= 10 and len(r[0]) >= 25]
          if not cands:
              sys.exit(1)
          run_ = max(cands, key=len)
          W = len(run_[0])
          frames = len(run_) // W
          qr = run_[(frames - 1) * W: frames * W] if frames >= 1 else run_
          w = max(len(l) for l in qr)
          rows = []
          for l in qr:
              t, b = zip(*[{'█': (1, 1), '▀': (1, 0), '▄': (0, 1), '▔': (1, 0), '▁': (0, 1)}.get(c, (0, 0)) for c in l.ljust(w)])
              rows.append(list(t)); rows.append(list(b))
          pad, S = 4, 8
          W, H = w + 2 * pad, len(rows) + 2 * pad
          img = Image.new('L', (W, H), 255)
          for y, row in enumerate(rows):
              for x, v in enumerate(row):
                  if v:
                      img.putpixel((x + pad, y + pad), 0)
          img.resize((W * S, H * S), Image.NEAREST).save(sys.argv[2])
          PY

          rm -f qr.txt qr.png
          TAG="tg-qr-$(date +%s)"
          LAST=""
          # watcher background: ASCII QR -> PNG -> release asset (browser me saaf image)
          (
            for _ in $(seq 1 58); do
              if [ -s qr.txt ] && python3 render.py qr.txt qr.png 2>/dev/null; then
                SUM=$(md5sum qr.png | cut -d' ' -f1)
                if [ "$SUM" != "$LAST" ]; then
                  LAST="$SUM"
                  gh release create "$TAG" qr.png --title "Telegram login QR" --notes "Ye image har ~30s refresh hoti hai. Phone me ye page kholo, phir Telegram: Settings > Devices > Link Desktop Device se is page ka QR scan karo." >/dev/null 2>&1 \
                    || gh release upload "$TAG" qr.png --clobber >/dev/null 2>&1
                  echo "QR: https://github.com/${{ github.repository }}/releases/download/$TAG/qr.png"
                fi
              fi
              sleep 5
            done
          ) &
          WATCH_PID=$!
          echo "QR image live ho rahi hai - phone me browser me kholo, phir Telegram: Settings > Devices > Link Desktop Device se us page ka QR scan karo."
          # tdl foreground me chalta hai (survey TTY maangta hai - script pseudo-TTY deta hai)
          script -qec "tdl login -T qr" /dev/null | tee qr.txt
          kill "$WATCH_PID" 2>/dev/null || true
          tdl chat ls >/dev/null 2>&1 || { echo "::error::QR scan nahi hua - run dobara chalao"; exit 1; }
          gh release delete "$TAG" -y >/dev/null 2>&1 || true
          echo "did_login=true" >> "$GITHUB_OUTPUT"
          echo "login ok"

      - name: Save tdl session (cache)
        if: steps.login.outputs.did_login == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.tdl
          key: tdl-session-v1

      - name: Download media
        run: |
          mkdir -p out
          tdl dl -u "${{ inputs.link }}" -d out
          ls -lh out
          find out -type f -size +1M -printf '%s %p\n' | sort -rn | head -5

      - name: Publish source + call h265 pipeline
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(find out -type f -size +1M | head -1)
          if [ -z "$f" ]; then
            echo "::error::is link pe koi media nahi mila - post shayad text-only/link-preview hai"
            exit 1
          fi
          TAG="tg-src-$(date +%s)"
          gh release create "$TAG" "$f" --title "Telegram source $TAG" \
            --notes "Raw download for ${{ inputs.link }} (no re-encode)."
          # asset ka asli browser URL use karo (space/naam quoting issues se bachne ke liye)
          URL=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" -q '.assets[0].browser_download_url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "SOURCE (unedited): $URL" >> "$GITHUB_STEP_SUMMARY"

  convert:
    needs: fetch
    uses: ./.github/workflows/convert-fast.yml
    with:
      url: ${{ needs.fetch.outputs.url }}
      chunks: ${{ inputs.chunks }}
      crf: ${{ inputs.crf }}
      preset: ${{ inputs.preset }}
name: Find master m3u8 URL from tweet

on:
  workflow_dispatch:
    inputs:
      tweet_url:
        description: 'Twitter/X video URL'
        required: true
        default: 'https://twitter.com/i/videos/2122184903760478208'

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp
        run: |
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp

      - name: Try tweet URL
        run: |
          echo "=== tweet URL formats ==="
          yt-dlp --no-warnings --list-formats "${{ inputs.tweet_url }}" 2>&1 || true
          echo "=== tweet URL print-json ==="
          yt-dlp --no-warnings --print-json "${{ inputs.tweet_url }}" 2>&1 | head -20 || true

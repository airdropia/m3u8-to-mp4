name: abc
on:
  workflow_dispatch:
    inputs:
      url:
        description: "test url"
        required: true
        default: "test"
jobs:
  smart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: echo ok
      - name: Download + merge (stream copy, no encode)
        run: |
          yt-dlp \
            --concurrent-fragments 16 \
            --retries 10 \
            -f "bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            -o "output.%(ext)s" \
            "${{ inputs.url }}"
          ls -lh output.*
      - name: Check size and decide
        id: decide
        run: |
          SIZE=$(stat -c%s output.mp4)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "mode=encode" >> "$GITHUB_OUTPUT"
          else
            echo "mode=copy" >> "$GITHUB_OUTPUT"
          fi
      - name: Light h265 (only if >2GB)
        if: steps.decide.outputs.mode == 'encode'
        run: |
          ffmpeg -y -loglevel warning -i output.mp4 \
            -c:v libx265 -crf 28 -preset ultrafast -tag:v hvc1 \
            -c:a aac -b:a 128k \
            output_h265.mp4
          mv output_h265.mp4 output.mp4
      - name: Extract audio (if exists)
        run: |
          has_audio=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output.mp4 | head -1)
          if [ -n "$has_audio" ]; then
            ffmpeg -y -loglevel error -i output.mp4 -vn -c:a copy audio.m4a
          else
            echo "NO AUDIO - skip"
          fi
      - name: Package zip
        run: |
          python3 -m zipfile -c video.zip output.mp4
          ls -lh video.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="merged-$(date +%s)"
          AUDIO_ASSET=""
          [ -f audio.m4a ] && AUDIO_ASSET="audio.m4a"
          if [ -n "$AUDIO_ASSET" ]; then
            gh release create "$TAG" video.zip "$AUDIO_ASSET" --title "Merged $TAG" --notes "Source: ${{ inputs.url }} - mode: ${{ steps.decide.outputs.mode }}"
          else
            gh release create "$TAG" video.zip --title "Merged $TAG" --notes "Source: ${{ inputs.url }} - mode: ${{ steps.decide.outputs.mode }}"
          fi
          echo "DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/$TAG/video.zip" >> "$GITHUB_STEP_SUMMARY"

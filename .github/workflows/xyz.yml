name: m3u8 to mp4 (smart: merge if <2GB, else light h265)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'm3u8 / HLS / tweet URL (master playlist with audio)'
        required: true
        default: 'https://video.twimg.com/amplify_video/2114470150699130880/pl/E8b928cjQN2ypYEx.m3u8?tag=29'
      audio_url:
        description: 'Audio m3u8 URL (optional - video-only source ke liye)'
        required: false
        default: ''


jobs:
  smart:
    steps:

      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Download + merge (stream copy, no encode)
        run: |
          yt-dlp \
            --concurrent-fragments 16 \
            --retries 10 \
            -f "bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            -o "output.%(ext)s" \
            "${{ inputs.url }}"
          ls -lh output.*

      - name: Check size and decide
        id: decide
        run: |
          SIZE=$(stat -c%s output.mp4)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "File size: $SIZE bytes ($(( SIZE / 1024 / 1024 )) MB)"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "mode=encode" >> "$GITHUB_OUTPUT"
            echo "File > 2GB - light h265 compression lagega"
          else
            echo "mode=copy" >> "$GITHUB_OUTPUT"
            echo "File < 2GB - stream copy (no encode), fast"
          fi

      - name: Light h265 (only if >2GB)
        run: |
          ffmpeg -y -loglevel warning -i output.mp4 \
            -c:v libx265 -crf 28 -preset ultrafast -tag:v hvc1 \
            -c:a aac -b:a 128k \
            output_h265.mp4
          mv output_h265.mp4 output.mp4
          ls -lh output.mp4
          echo "After encode: $(( $(stat -c%s output.mp4) / 1024 / 1024 )) MB"

      - name: Extract audio (if exists)
        run: |
          has_audio=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output.mp4 | head -1)
          if [ -n "$has_audio" ]; then
            ffmpeg -y -loglevel error -i output.mp4 -vn -c:a copy audio.m4a
            echo "audio: $has_audio -> audio.m4a"
            ls -lh audio.m4a
          else
            echo "NO AUDIO - skip"
          fi

      - name: Package zip
        run: |
          python3 -m zipfile -c video.zip output.mp4
          ls -lh video.zip

      - name: Create release
        run: |
          TAG="merged-$(date +%s)"
          AUDIO_ASSET=""
          [ -f audio.m4a ] && AUDIO_ASSET="audio.m4a"
          if [ -n "$AUDIO_ASSET" ]; then
            gh release create "$TAG" video.zip "$AUDIO_ASSET" --title "Merged $TAG" --notes "Source: ${{ inputs.url }} - mode: ${{ steps.decide.outputs.mode }}"
          else
            gh release create "$TAG" video.zip --title "Merged $TAG" --notes "Source: ${{ inputs.url }} - mode: ${{ steps.decide.outputs.mode }}"
          fi
          echo "DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/$TAG/video.zip" >> "$GITHUB_STEP_SUMMARY"
          [ -f audio.m4a ] && echo "AUDIO: https://github.com/${{ github.repository }}/releases/download/$TAG/audio.m4a" >> "$GITHUB_STEP_SUMMARY"
